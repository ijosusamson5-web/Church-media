<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church Media Display</title>
<script>
  // ====== AI Photo-Scan Setup (optional) ======
  // If this site is deployed on Netlify using the included
  // netlify/functions/ai-proxy function, the "Parse order of service"
  // button works automatically — no setup needed here at all.
  //
  // Leave this blank unless you're using a different proxy (like a
  // standalone Cloudflare Worker) instead of Netlify's. If so, paste
  // its URL below:
  //   window.AI_PROXY_URL = "https://church-ai-proxy.yourname.workers.dev";
  window.AI_PROXY_URL = "";
</script>
<style>
  html, body { margin: 0; padding: 0; background: #F4F6F9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // ====== Cross-device sync ======
  // When this page is opened through the "Church Sync Server" (see
  // README-SYNC-SETUP.md), shared data is read from / written to that
  // local server instead of just this browser's storage — so every
  // device on the same WiFi/hotspot sees the same live schedule within
  // about a second, with no page refresh needed, and no internet
  // required. If no sync server is reachable (e.g. this file was just
  // opened directly, or the network drops), it falls back to this
  // device's own local storage automatically, so the app never breaks.
  window.storage = (function () {
    function localGet(key) {
      try {
        var v = localStorage.getItem("cmd_" + key);
        return v == null ? null : { key: key, value: v };
      } catch (e) { return null; }
    }
    function localSet(key, value) {
      try {
        localStorage.setItem("cmd_" + key, value);
        return { key: key, value: value };
      } catch (e) { return null; }
    }
    return {
      get: async function (key, shared) {
        if (shared && location.protocol !== "file:") {
          try {
            var res = await fetch("storage/" + encodeURIComponent(key), { cache: "no-store" });
            if (res.ok) {
              var data = await res.json();
              if (data && data.value != null) return data;
              return null;
            }
          } catch (e) { /* server not reachable — fall back below */ }
        }
        return localGet(key);
      },
      set: async function (key, value, shared) {
        if (shared && location.protocol !== "file:") {
          try {
            var res = await fetch("storage/" + encodeURIComponent(key), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ value: value })
            });
            if (res.ok) {
              localSet(key, value);
              return await res.json();
            }
          } catch (e) { /* server not reachable — fall back below */ }
        }
        return localSet(key, value);
      },
      delete: async function (key) {
        try { localStorage.removeItem("cmd_" + key); } catch (e) {}
        return { key: key, deleted: true };
      },
      list: async function () { return { keys: [] }; }
    };
  })();

  // ====== AI photo-scan helper ======
  // Tries, in order: an explicit window.AI_PROXY_URL override, then the
  // relative "ai-proxy" endpoint (works automatically once deployed on
  // Netlify with the included function, or any self-hosted proxy that
  // serves that same relative path), then finally the direct Anthropic
  // URL (which only works when this page is opened inside Claude.ai /
  // the Claude app, which proxies that exact call for you). If every
  // option fails, the caller's own error handling takes over — this
  // never hangs or throws an uncaught error.
  window.__callClaude = async function (payload) {
    var candidates = [];
    if (window.AI_PROXY_URL) candidates.push(window.AI_PROXY_URL);
    if (location.protocol !== "file:") candidates.push("ai-proxy");
    candidates.push("https://api.anthropic.com/v1/messages");
    var lastErr = null;
    for (var i = 0; i < candidates.length; i++) {
      try {
        var res = await fetch(candidates[i], {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) return res;
        lastErr = new Error("HTTP " + res.status);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("All AI endpoints failed");
  };

</script>
